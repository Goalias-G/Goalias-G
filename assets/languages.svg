<svg xmlns="http://www.w3.org/2000/svg" width="420" height="176" viewBox="0 0 420 176" role="img" aria-label="Language Skills">
  <defs>
    <clipPath id="pill">
      <rect x="20" y="48" width="380" height="12" rx="6" ry="6"/>
    </clipPath>
    <clipPath id="reveal">
      <rect x="20" y="48" width="380" height="12">
        <animate attributeName="width" values="0;380" dur="1.35s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" keyTimes="0;1"/>
      </rect>
    </clipPath>
    <style>
      .title { fill: #58a6ff; font-family: ui-sans-serif, system-ui, Segoe UI, sans-serif; font-size: 15px; font-weight: 700; }
      .name { fill: #c9d1d9; font-family: ui-sans-serif, system-ui, Segoe UI, sans-serif; font-size: 12px; }
      .pct  { fill: #8b949e; font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
    </style>
  </defs>

  <rect width="420" height="176" rx="12" fill="#0d1117" stroke="#21262d"/>
  <text class="title" x="20" y="32">Language Skills</text>

  <rect x="20" y="48" width="380" height="12" rx="6" ry="6" fill="#21262d"/>

  <!-- 36+17+13+10+8+6+5+5 = 100 ? 380px -->
  <g clip-path="url(#pill)">
    <g clip-path="url(#reveal)">
      <rect x="20"  y="48" width="137" height="12" fill="#f89820"/>
      <rect x="157" y="48" width="65"  height="12" fill="#3178c6"/>
      <rect x="222" y="48" width="49"  height="12" fill="#4479a1"/>
      <rect x="271" y="48" width="38"  height="12" fill="#f1e05a"/>
      <rect x="309" y="48" width="30"  height="12" fill="#3572a5"/>
      <rect x="339" y="48" width="23"  height="12" fill="#e34c26"/>
      <rect x="362" y="48" width="19"  height="12" fill="#563d7c"/>
      <rect x="381" y="48" width="19"  height="12" fill="#7f52ff"/>
    </g>
  </g>

  <circle cx="26" cy="90" r="4" fill="#f89820"/>
  <text class="name" x="36" y="94">Java</text>
  <text class="pct" x="130" y="94">36%</text>

  <circle cx="220" cy="90" r="4" fill="#3178c6"/>
  <text class="name" x="230" y="94">TypeScript</text>
  <text class="pct" x="360" y="94">17%</text>

  <circle cx="26" cy="112" r="4" fill="#4479a1"/>
  <text class="name" x="36" y="116">SQL</text>
  <text class="pct" x="130" y="116">13%</text>

  <circle cx="220" cy="112" r="4" fill="#f1e05a"/>
  <text class="name" x="230" y="116">JavaScript</text>
  <text class="pct" x="360" y="116">10%</text>

  <circle cx="26" cy="134" r="4" fill="#3572a5"/>
  <text class="name" x="36" y="138">Python</text>
  <text class="pct" x="130" y="138">8%</text>

  <circle cx="220" cy="134" r="4" fill="#e34c26"/>
  <text class="name" x="230" y="138">HTML</text>
  <text class="pct" x="360" y="138">6%</text>

  <circle cx="26" cy="156" r="4" fill="#563d7c"/>
  <text class="name" x="36" y="160">CSS</text>
  <text class="pct" x="130" y="160">5%</text>

  <circle cx="220" cy="156" r="4" fill="#7f52ff"/>
  <text class="name" x="230" y="160">Kotlin</text>
  <text class="pct" x="360" y="160">5%</text>
</svg>
